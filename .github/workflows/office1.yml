name: Office 1 — Preventive Las Vegas

on:
  schedule:
    # Runs at 9am Mountain Time on the 1st of every month
    # (9am MT = 4pm UTC in summer, 5pm UTC in winter — using 16:00 UTC)
    - cron: "0 16 1 * *"
  workflow_dispatch:  # ← This adds a "Run workflow" button so you can trigger it manually anytime

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FR_OFFICE1_SUBDOMAIN: ${{ secrets.FR_OFFICE1_SUBDOMAIN }}
      FR_OFFICE1_KEY: ${{ secrets.FR_OFFICE1_KEY }}
      FR_OFFICE1_TOKEN: ${{ secrets.FR_OFFICE1_TOKEN }}
      GHL_API_TOKEN: ${{ secrets.GHL_API_TOKEN }}
      GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test API connection
        run: python3 scripts/test_connection.py

      - name: GHL daily sync — Office 1
        run: python3 scripts/ghl_sync_office1.py
