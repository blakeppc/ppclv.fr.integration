name: Keepalive

# Prevents GitHub from auto-disabling the scheduled sync workflows
# (bigquery/office1/office2) after 60 days of repository inactivity
# (state "disabled_inactivity"). Writes a timestamp and commits it twice a
# month so the repo always has recent activity. [skip ci] keeps this commit
# from triggering anything (the sync workflows are schedule-only anyway).
on:
  schedule:
    - cron: "17 9 1,15 * *"   # 1st & 15th each month, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch keepalive file and commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive [skip ci]" || { echo "no change"; exit 0; }
          git push
