name: Office 2 — Preventive Pest Control Commercial

on:
  schedule:
    # Daily at 2am Pacific (9:00 UTC during PDT; 1am PST in winter — UTC cron can't track DST)
    - cron: "0 9 * * *"
  workflow_dispatch:  # ← "Run workflow" button for manual runs
    inputs:
      days:
        description: "Lookback days (default 2; use e.g. 75 for a one-time catch-up/backfill)"
        required: false
        default: "2"

jobs:
  run:
    runs-on: ubuntu-latest
    # High cap so an occasional wide-lookback catch-up can finish; daily runs take ~3 min.
    timeout-minutes: 150

    env:
      FR_OFFICE2_SUBDOMAIN: ${{ secrets.FR_OFFICE2_SUBDOMAIN }}
      FR_OFFICE2_KEY: ${{ secrets.FR_OFFICE2_KEY }}
      FR_OFFICE2_TOKEN: ${{ secrets.FR_OFFICE2_TOKEN }}
      GHL_API_TOKEN: ${{ secrets.GHL_API_TOKEN }}
      GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test API connection
        run: python3 scripts/test_connection.py

      - name: GHL daily sync — Office 2
        run: python3 scripts/ghl_sync_office2.py --days ${{ github.event.inputs.days || '2' }}
